<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maestro</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
:root{--bg:#f6f5f1;--side:#efeee8;--panel:#fff;--ink:#1b1b19;--mute:#77756d;--line:#e3e1d8;--soft:#f1f0ea;
--acc:#1e5a46;--acc2:#e5efea;--run:#2463c7;--wait:#b26a00;--ok:#1e7a4c;--bad:#b4362a}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:14px/1.55 "Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px}
button:hover{border-color:#c8c5ba}button:disabled{opacity:.45;cursor:default}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.ghost{border-color:transparent;background:transparent}button.ghost:hover{background:rgba(0,0,0,.05)}
button.icon{padding:6px;line-height:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input[type=text],textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel)}
textarea{resize:vertical}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-columns:260px 1fr;height:100%}
aside{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:9px;padding:14px 14px 10px;font-weight:650;letter-spacing:-.01em}
.brand img{width:22px;height:22px}.ver{font-size:11px;font-weight:500;color:var(--mute);margin-left:auto}
.newtask{margin:2px 10px 4px;display:flex;align-items:center;gap:8px;justify-content:center}
.lbl{font-size:11px;font-weight:650;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;padding:12px 16px 4px}
.tlist{flex:1;overflow:auto;padding:0 8px 8px;min-height:0}
.titem{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;text-align:left;padding:7px 8px;border-radius:8px}
.titem:hover{background:rgba(0,0,0,.04)}.titem.on{background:var(--panel);box-shadow:0 0 0 1px var(--line)}
.titem span.t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sd{width:8px;height:8px;border-radius:50%;flex:none;background:#c4c1b6}
.sd.running,.sd.queued{background:var(--run)}.sd.waiting{background:var(--wait)}.sd.done{background:var(--ok)}.sd.failed,.sd.limit{background:var(--bad)}
.sd.running{animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}
.foot{display:flex;align-items:center;flex-wrap:wrap;gap:4px;padding:8px 10px;border-top:1px solid var(--line)}
.ais{flex:1 1 100%;display:flex;gap:12px;font-size:12px;color:var(--mute);white-space:nowrap;padding:2px 4px 4px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#c4c1b6;margin-right:4px;vertical-align:1px}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.pend{background:var(--run);animation:pulse 1.2s infinite}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.thead{display:flex;align-items:center;gap:8px;padding:12px 22px;border-bottom:1px solid var(--line)}
.thead h1{font-size:15px;margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thead .grow{flex:1}
.thead input{font-size:15px;font-weight:600;padding:4px 8px;max-width:520px}
.pill{font-size:12px;border-radius:99px;padding:1px 9px;white-space:nowrap;background:var(--soft);color:var(--mute)}
.pill.login{background:#fbf0de;color:var(--wait)}.sd.login{background:var(--wait)}.pill.running,.pill.queued{background:#e6eefb;color:var(--run)}.pill.waiting{background:#fbf0de;color:var(--wait)}
.pill.done,.pill.completed{background:#e3f2ea;color:var(--ok)}.pill.failed,.pill.rejected,.pill.limit,.pill.timeout{background:#f8e5e2;color:var(--bad)}
.scroll{flex:1;overflow:auto;min-height:0}
.thread{max-width:780px;margin:0 auto;padding:22px 22px 10px;display:flex;flex-direction:column;gap:16px}
.msg{white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 4px 16px;padding:9px 13px;max-width:85%}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.thumbs img{height:110px;max-width:220px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.att{font-size:12px;color:var(--mute);margin-top:4px}
.claude .txt{overflow-wrap:anywhere}.claude .txt p{margin:0 0 6px}.claude .txt ul{margin:0 0 6px;padding-left:20px}.claude .txt li{margin:2px 0}
.claude .txt code{font:12.5px ui-monospace,Consolas,monospace;background:var(--soft);border-radius:4px;padding:1px 5px}
.claude.question .txt,.claude.error .txt{white-space:normal}
.openf{margin-top:10px;display:inline-flex;align-items:center;gap:8px}
.claude.question .txt{background:#fbf0de;border-radius:10px;padding:9px 12px}
.claude.error .txt{background:#f8e5e2;border-radius:10px;padding:9px 12px;font-size:13px}
.files{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.fcard{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:9px 12px;min-width:220px;max-width:340px;text-align:left}
.fcard:hover{border-color:#c8c5ba}.fcard b{display:block;font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}
.fcard small{color:var(--mute);font-size:12px}.fic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--acc2);color:var(--acc);flex:none}
.work{color:var(--mute);font-size:13px}
.whead{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none;border:0;background:none;padding:2px 0;color:var(--mute)}
.whead:hover{color:var(--ink)}.whead svg{transition:transform .15s}.whead.open svg{transform:rotate(90deg)}
.wbody{margin:6px 0 0 6px;padding-left:12px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:3px}
.wstep{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.wstep.cur{color:var(--ink)}
.subs{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:8px 0 2px;color:var(--ink)}
.sub{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:7px 12px;font-size:13px}
.sub+.sub{border-top:1px solid var(--line)}
.sub .id{color:var(--mute);min-width:36px;white-space:nowrap}.sub .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:0 8px;color:var(--mute);background:var(--panel);white-space:nowrap}
.lib{max-width:1000px;margin:0 auto;padding:16px 22px}
.lib table{width:100%;border-collapse:collapse;font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lib th{text-align:left;font-weight:600;color:var(--mute);font-size:12px;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.lib td{padding:7px 12px;border-bottom:1px solid var(--line);white-space:nowrap}.lib tr:last-child td{border-bottom:0}
.lib td.w{white-space:normal;overflow-wrap:anywhere;font-weight:500}.lib td.w2{max-width:220px;overflow:hidden;text-overflow:ellipsis;color:var(--mute)}
.lib tr.click{cursor:pointer}.lib tr.click:hover td{background:var(--soft)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.seg button{border:0;border-radius:0}.seg button.on{background:var(--acc2);color:var(--acc);font-weight:600}
#decbar:not(:empty){padding:8px 22px 0}#decbar .dec{max-width:780px;margin:0 auto;max-height:38vh;overflow:auto}
.dec{border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:13px}
.dec>button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;text-align:left;font-weight:600;padding:8px 12px}
.dec .g{padding:6px 12px 8px;border-top:1px solid var(--line)}.dec .g b{display:block;margin-bottom:3px}
.dec .it{display:flex;gap:8px;padding:2px 0}.dec .tag{flex:none;font-size:11px;border-radius:99px;padding:0 7px;height:18px;line-height:18px;margin-top:2px}
.dec .tag.decision{background:#e3f2ea;color:var(--ok)}.dec .tag.feedback{background:#fbf0de;color:var(--wait)}.dec .it.done span:last-child{color:var(--mute);text-decoration:line-through}
.compwrap{padding:10px 22px 18px}
.comp{max-width:780px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.comp.drag{box-shadow:0 0 0 2px var(--acc)}
.comp textarea{border:0;padding:4px 2px;min-height:46px;max-height:60vh;resize:none;background:transparent;overflow-y:auto;line-height:1.55}.comp textarea:focus{outline:none}
.bar{display:flex;align-items:center;gap:4px}
.atts{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 6px}
.a{display:inline-flex;align-items:center;gap:2px;font-size:12px;background:var(--soft);border-radius:6px;padding:2px 2px 2px 8px;max-width:260px}
.a span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.a button{border:0;background:none;padding:0 6px;color:var(--mute)}
.hint{font-size:12px;color:var(--mute)}
.home{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 22px 14vh}
.home h2{text-align:center;font-weight:600;font-size:22px;margin:0 0 18px;letter-spacing:-.01em}
.home .comp textarea{min-height:90px}
.ov{position:fixed;inset:0;background:rgba(27,27,25,.35);display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow:auto;z-index:8}
.ov.show{display:flex}
.modal{width:100%;max-width:580px;background:var(--panel);border-radius:14px;border:1px solid var(--line);display:flex;flex-direction:column;max-height:88vh}
#mUpd{display:inline-flex;align-items:center;gap:6px;line-height:1}#mUpd svg{width:15px;height:15px}
.mhead{padding:16px 20px 0;font-weight:650;font-size:16px}.tabs{display:flex;gap:2px;padding:12px 12px 0;border-bottom:1px solid var(--line)}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:8px 12px;color:var(--mute)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--acc);font-weight:600}
.mbody{padding:18px 20px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.mfoot{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--line)}
.f{display:flex;flex-direction:column;gap:6px}.f>.k{font-size:12px;font-weight:600;color:var(--mute)}
.row{display:flex;align-items:center;gap:8px}
.accrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.accrow .n{flex:1;min-width:0}.accrow small{display:block;color:var(--mute);font-size:12px;overflow-wrap:anywhere}
.accrow small.bad{color:var(--bad)}
.kchip{display:inline-block;padding:1px 7px;border:1px solid var(--line);border-radius:6px;font-size:12px;color:var(--mute);margin-right:6px}
.inst{margin-top:8px;font-size:13px}.inst li{margin:2px 0}
.wbtn{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;margin-right:8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--mute);font:inherit;font-size:13px;cursor:pointer;position:relative}
.wbtn:hover{color:var(--ink,#222)}.wbtn.on{background:var(--ink,#222);border-color:var(--ink,#222);color:#fff}
.wbtn[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);right:0;white-space:nowrap;background:#222;color:#fff;font-size:12px;padding:5px 8px;border-radius:6px;z-index:30;pointer-events:none}
.umenu{position:fixed;left:12px;bottom:56px;width:300px;padding:10px 12px;z-index:40}
.acost{font-size:12px;color:var(--mute);margin:2px 0 4px}
.umenu .ur2{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;font-size:13px;padding:4px 0 0}
.umenu .ur2 .ul{display:flex;flex-direction:column;min-width:0}.umenu .ur2 .ul small{font-size:11.5px;color:var(--mute);line-height:16px}
.umenu .ur2 .uu{color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}.umenu .ur2.low .uu{color:var(--bad);font-weight:600}
.umenu .ur2+.bar2{margin-top:5px}.umenu .ur2.low+.bar2 i{background:var(--bad)}
.umenu .uh{display:flex;align-items:center;font-size:13px;margin:-2px 0 4px}.umenu .uh b{font-weight:600;display:inline;white-space:nowrap}.umenu .uh .icon{min-width:28px;min-height:28px;color:var(--mute);margin-left:auto;width:28px;padding:0}
.umenu .un a{display:inline-flex;color:var(--mute);margin-left:6px}.umenu .un a svg.i{width:14px;height:14px}.umenu .un .note{font-weight:400}.umenu .ua{border-top:1px solid var(--line);padding:9px 0 7px}
.umenu .ua:first-of-type{border-top:0;padding-top:2px}.umenu .un{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px;margin-bottom:4px}
.umenu .ur{display:flex;justify-content:space-between;font-size:13px;padding:2px 0}.umenu .ur span:last-child{color:var(--mute)}
.umenu .ur.low span:last-child{color:var(--bad);font-weight:600}.umenu .bar2{height:4px;background:#eee;border-radius:3px;margin:1px 0 4px;overflow:hidden}
.umenu .bar2 i{display:block;height:100%;background:var(--ink,#222)}.umenu .ur.low+.bar2 i{background:var(--bad)}
.umenu .note{font-size:12px;color:var(--mute)}.umenu .uf{display:flex;gap:8px;align-items:center;margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
.umenu label.sw{font-size:12px;color:var(--mute);display:flex;gap:6px;align-items:center;margin-top:3px;cursor:pointer}
.umenu a{font-size:12px;color:var(--mute)}
.plan{display:inline-block;margin-left:6px;padding:0 6px;border:1px solid var(--line);border-radius:6px;font-size:11px;color:var(--mute);font-weight:500}
.freebar{margin:0 0 14px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fafaf9;font-size:13px;color:var(--mute);display:flex;gap:10px;align-items:center}
.freebar b{color:var(--ink,#222)}.freebar .grow{flex:1}
.path{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:7px 10px;background:var(--soft);border-radius:8px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 14px;border-radius:8px;display:none;z-index:9;max-width:90vw}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .8s linear infinite;flex:none}
@keyframes s{to{transform:rotate(360deg)}}
@media (max-width:760px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr}aside{max-height:38vh}}

@font-face{font-family:Geist;src:url(/fonts/Geist-Variable.woff2) format("woff2");font-weight:100 900;font-display:swap}

body{font:15px/1.6 Geist,"Segoe UI",Arial,sans-serif;font-feature-settings:"ss01" 0}

    if (!confirm(run ? `Thoát Maestro? ${run} task đang chạy sẽ dừng và tự chạy tiếp khi mở lại.` : "Thoát Maestro?")) return;
    await api("/api/quit", {}); closeSettings(); window.QUIT = true;
    document.body.innerHTML = `<div style="display:grid;place-items:center;height:100vh;font:15px system-ui;color:#555;text-align:center">Đã thoát Maestro.<br>Mở lại từ ${S.os === "mac" ? "Launchpad / Applications" : "Start Menu"} (Maestro).</div>`;
  };
  const saveKey = async (v) => { const r = await api("/api/gemini-key", { key: v }); toast(r.error || r.msg); if (!r.error) { await refresh(); renderSettings(); } return !r.error; };
  if ($("gSave")) $("gSave").onclick = () => { const v = $("gKey").value.trim(); if (v) saveKey(v); else $("gKey").focus(); };
  if ($("gGet")) $("gGet").onclick = () => { window.open("https://aistudio.google.com/apikey", "_blank"); keyWait = true; renderSettings(); };
  if ($("gDel")) $("gDel").onclick = () => { if (confirm("Xoá Gemini API key khỏi máy này?")) saveKey(""); };
  let memT = 0;      // ghi nhớ tự lưu khi ngừng gõ (không cần nút Lưu)
  const memSave = async () => { clearTimeout(memT); const v = $("memTxt")?.value ?? ""; if (v === (S.instructions || "")) return; const r = await api("/api/memory", { instructions: v }); if (r.error) toast(r.error); else { S.instructions = v; toast("Đã lưu ghi nhớ"); } };
  $("memTxt").oninput = () => { clearTimeout(memT); memT = setTimeout(memSave, 1200); };
  $("memTxt").onblur = memSave;
  $("mLog").onclick = async () => { const r = await api("/api/export-log", {}); toast(r.error || r.msg); };
  $("oPick").onclick = async () => { if (picking) return; picking = true; let r = {}; try { r = await api("/api/pick", { title: "Chọn thư mục nhận kết quả" }); } finally { picking = false; } if (r.path) { form.output = r.path; const s = await api("/api/setup", form); if (s.error) toast(s.error); else S.output = form.output; renderSettings(); } };
  $("mDone").onclick = () => { if (!S.output) return toast("Chọn thư mục nhận kết quả"); closeSettings(); };
  $("mUpd").onclick = async () => {
    const b = $("mUpd"); b.disabled = true; b.innerHTML = '<span class="spin"></span> Đang kiểm tra…';
    const r = await api("/api/update", {}); toast(r.error || r.msg);
    if (r.restart) { setTimeout(function wait() { fetch("/icon.svg").then(() => location.reload(), () => setTimeout(wait, 1000)); }, 2500); return; }
    renderSettings();
  };
}
let keyWait = false, lastClip = "", fb = {};
async function clipCheck() {   // quay lại tab Maestro: tự dán mã đăng nhập / API key vừa copy
  if (!$("ov").classList.contains("show") || !navigator.clipboard?.readText) return;
  const box = document.querySelector("[id^=code_]"), kb = $("gKey");
  if (!box && !(kb && keyWait)) return;
  let v = ""; try { v = (await navigator.clipboard.readText()).trim(); } catch (e) { return; }
  if (!v || v === lastClip || v.length > 900 || /\s/.test(v)) return;
  if (kb && keyWait && /^AIza[\w-]{30,}$/.test(v)) { lastClip = v; keyWait = false; kb.value = v; $("gSave").click(); return; }
  if (box && !box.value && !/^https?:/.test(v) && !/^AIza/.test(v) && v.length >= 20) { lastClip = v; box.value = v; document.querySelector(`[data-code=${box.id.slice(5)}]`)?.click(); }
}
addEventListener("focus", clipCheck);
document.addEventListener("visibilitychange", () => { if (!document.hidden) clipCheck(); });
function closeSettings() {
  $("ov").classList.remove("show"); chain = false;
  if ($("homeComp") && !$("txt").value.trim()) renderHome();   // banner chế độ Free/đăng nhập đổi theo tài khoản vừa sửa
  kick();
}
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("ov").classList.contains("show")) closeSettings(); });

refresh();
// Cập nhật thưa khi không có gì chạy hoặc tab đang ẩn (nhẹ máy); nhanh khi có task đang làm
let timer = 0;
function nextDelay() {
  const active = S && (S.tasks.some((t) => ["running", "queued", "login"].includes(t.status)) || Object.values(S.ais).some((a) => a.pending));
  if (document.hidden) return 20000;
  if ($("ov").classList.contains("show") || (S && Object.values(S.ais).some((a) => a.pending))) return 2500;
  if (T && $("taskComp") && T.status === "running") {      // task lớn: 30 giây/lần, task nhỏ: 5 giây/lần
    const w = [...T.messages].reverse().find((m) => m.role === "work");
    const big = w && ((w.nsteps || 0) >= 5 || (T._now - w.started_ts) > 600);
    return big ? 30000 : 5000;
  }
  return active ? 5000 : 10000;
}
async function loop() { await refresh(); timer = setTimeout(loop, nextDelay()); }
function kick() { clearTimeout(timer); timer = setTimeout(loop, 300); }
document.addEventListener("visibilitychange", () => { if (!document.hidden) kick(); });
timer = setTimeout(loop, nextDelay());
</script>
